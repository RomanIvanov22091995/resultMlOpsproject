# Единый файл параметров проекта.
# DVC отслеживает изменения этих значений: при правке параметра
# `dvc repro` перезапустит только зависящие от него стадии.

base:
  random_state: 42

data:
  raw_path: data/raw/UCI_Credit_Card.csv
  processed_dir: data/processed
  test_size: 0.2

validation:
  suite_path: data/expectations/credit_data_suite.json
  report_path: reports/validation/raw_data_validation.json

train:
  cv_folds: 5
  scoring: roc_auc
  n_jobs: -1
  # Порог классификации подбирается по out-of-fold предсказаниям на train
  # (максимизация F1), чтобы не подглядывать в тестовую выборку.
  threshold_metric: f1
  model_path: models/credit_default_model.pkl
  meta_path: models/model_meta.json
  reference_scores_path: models/reference_scores.csv
  metrics_path: reports/metrics.json
  figures_dir: reports/figures
  roc_points_path: reports/roc_curve.csv
  summary_path: reports/experiments_summary.csv

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: mlruns
  experiment_name: credit-default-pd
  registered_model_name: CreditDefaultModel

# Пространства гиперпараметров для каждого алгоритма.
# Каждый алгоритм = отдельный эксперимент (run) в MLflow,
# каждая комбинация гиперпараметров = вложенный (nested) run.
models:
  logistic_regression:
    search: grid
    params:
      C: [0.01, 0.1, 1.0, 10.0]
      class_weight: [null, balanced]

  random_forest:
    search: random
    n_iter: 12
    params:
      n_estimators: [200, 400]
      max_depth: [6, 10, 14, null]
      min_samples_leaf: [1, 5, 20]
      max_features: [sqrt, 0.3]
      class_weight: [null, balanced_subsample]

  extra_trees:
    search: random
    n_iter: 10
    params:
      n_estimators: [200, 400]
      max_depth: [8, 12, null]
      min_samples_leaf: [1, 5, 20]
      max_features: [sqrt, 0.5]

  gradient_boosting:
    search: random
    n_iter: 12
    params:
      n_estimators: [100, 200, 300]
      learning_rate: [0.03, 0.05, 0.1]
      max_depth: [2, 3, 4]
      subsample: [0.8, 1.0]
      min_samples_leaf: [1, 20, 50]

  hist_gradient_boosting:
    search: random
    n_iter: 15
    params:
      learning_rate: [0.03, 0.05, 0.1]
      max_iter: [100, 200, 400]
      max_leaf_nodes: [15, 31, 63]
      min_samples_leaf: [20, 50, 100]
      l2_regularization: [0.0, 0.1, 1.0]
